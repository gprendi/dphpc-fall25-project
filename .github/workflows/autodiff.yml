name: autodiff-validation

on:
  pull_request:
    branches:
      - kernels
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  autodiff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync project dependencies
        run: uv sync

      - name: Run autodiff backprop benchmarks
        run: ./scripts/run_autodiff_backprop.sh -f pytorch_cpu -p S -r 2
